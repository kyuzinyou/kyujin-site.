<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com; connect-src https://docs.google.com https://*.googleusercontent.com https://formspree.io; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飲食店特化の求人サイト</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7EF;--card:#fff;--ink:#3a3330;--mute:#8a7f78;--line:#eee6da;--coral:#F4766B;--green:#4FBF6F;--blue:#4A9BEE;--pink:#FDE3E1;--cream:#FBE9CF;--mint:#DDF3E3;--sky:#DCEBFB;--yel:#FFD84D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241f1c;--card:#322b27;--ink:#f3ece4;--mute:#b5a99e;--line:#463d37;--pink:#4a2d2b;--cream:#4a3d2a;--mint:#26402f;--sky:#27384c}}
:root[data-theme="dark"]{--bg:#241f1c;--card:#322b27;--ink:#f3ece4;--mute:#b5a99e;--line:#463d37;--pink:#4a2d2b;--cream:#4a3d2a;--mint:#26402f;--sky:#27384c}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;line-height:1.6}
.w{max-width:520px;margin:0 auto;padding:0 18px}
.hero{position:relative;padding:34px 0 10px;overflow:hidden}
.hero:before{content:"";position:absolute;left:-60px;top:-60px;width:180px;height:180px;background:#bfe3f7;border-radius:50%;opacity:.6}
.hero .cp{font-size:26px;font-weight:900;line-height:1.35;transform:rotate(-4deg);position:relative;margin:6px 0 0;color:#6b5d52}
.hero .ph{width:62%;margin-left:auto;margin-top:-70px;border-radius:28px 28px 0 80px;display:block;aspect-ratio:1/1.25;object-fit:cover;object-position:50% 15%}
.ttl{background:var(--card);margin:-48px 0 0;position:relative;padding:14px 16px;border-radius:22px;box-shadow:0 6px 24px #0001;transform:rotate(-3deg)}
.ttl b{display:block;font-size:34px;font-weight:900;line-height:1.15;color:var(--coral)}.ttl b span{color:var(--ink)}
.ttl p{margin:6px 0 0;font-weight:700;font-size:14px;background:linear-gradient(transparent 70%,var(--yel) 70%);display:inline}
.ok{display:flex;gap:10px;justify-content:center;margin:34px 0 8px}
.ok div{width:30%;aspect-ratio:1;border-radius:50%;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:17px;line-height:1.2}.ok small{font-size:12px}
h2{font-size:21px;font-weight:900;text-align:center;margin:44px 0 6px;background:linear-gradient(transparent 68%,var(--yel) 68%);display:inline-block;transform:rotate(-2deg)}
.c{text-align:center}.sub{text-align:center;color:var(--mute);font-size:13px;margin:0 0 18px}
.rec{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.rec div{border-radius:18px;overflow:hidden;font-weight:700;font-size:13px;text-align:center}.rec img{width:100%;aspect-ratio:1.45;object-fit:cover;display:block}.rec p{margin:0;padding:12px 6px;border-radius:18px 18px 0 0;margin-top:-14px;position:relative}
.panel{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 4px 18px #0000000d}
.panel label,.f label{font-size:12px;font-weight:700;color:var(--mute);display:block;margin:10px 0 4px}
input,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--coral)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{margin:0;display:inline-flex}
.chips input{display:none}.chips span{padding:7px 12px;border-radius:99px;border:2px solid var(--line);font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
.chips input:checked+span{background:var(--coral);border-color:var(--coral);color:#fff}
.rs{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px;font-weight:700}.rs button{background:none;border:0;color:var(--coral);font:inherit;font-weight:700;cursor:pointer}
.card{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 6px 22px #00000012;margin-bottom:22px}
.im{position:relative;aspect-ratio:1.6;background:linear-gradient(135deg,var(--pink),var(--cream));display:flex;align-items:center;justify-content:center;font-size:54px}.im img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.tag{position:absolute;left:12px;top:12px;color:#fff;font-weight:700;font-size:13px;padding:4px 14px;border-radius:99px}
.cm{position:absolute;right:12px;top:14px;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 4px #000a;text-align:right;max-width:45%}
.bd{padding:14px 18px 18px}.bd h3{margin:0;font-size:20px}.bd h3 small{font-size:12px;font-weight:500;color:var(--mute)}.bd .k{color:#d99a5b;font-size:12px;margin-bottom:6px}
.r{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;align-items:flex-start}.r i{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center}.r em{font-style:normal;color:var(--mute);flex:none;width:52px;font-size:12px}.r span{flex:1}.r .w2{font-size:15px;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:99px;color:#fff;font:inherit;font-weight:900;font-size:16px;padding:13px;margin-top:10px;cursor:pointer;box-shadow:0 4px 0 #0002}
.coral{background:var(--coral)}.green{background:var(--green)}.blue{background:var(--blue)}
.none{text-align:center;padding:40px 10px;color:var(--mute)}
.ft{margin:30px -18px 0;background:var(--coral);color:#fff;text-align:center;padding:34px 18px 40px;border-radius:50% 50% 0 0/26px 26px 0 0;font-weight:700}
.ft a{display:inline-block;background:#fff;color:var(--coral);border-radius:99px;padding:12px 28px;font-weight:900;text-decoration:none;margin-top:10px}
.rv{opacity:0;transform:translateY(22px);transition:.6s}.rv.on{opacity:1;transform:none}
.ov{position:fixed;inset:0;background:#000a;display:none;z-index:50;align-items:flex-end;justify-content:center}.ov.open{display:flex}
.sh{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .3s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.x{position:sticky;top:0;float:right;margin:10px;width:36px;height:36px;border-radius:50%;border:0;background:#fffd;color:#333;font-size:20px;z-index:2;cursor:pointer}
.in{padding:0 20px}.in h3{font-size:22px;margin:16px 0 2px}.in p{font-size:14px}
.done{text-align:center;padding:40px 24px}.done .e{font-size:60px}.done h3{font-size:22px;color:var(--green)}
.note{font-size:11px;color:var(--mute)}
.pv{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px;margin-top:14px;font-size:12px}
.pv ul{margin:6px 0 8px;padding-left:18px}.pv li{margin:4px 0}.pv summary{cursor:pointer;font-weight:700;color:var(--coral)}
.in .pol p{font-size:12px;margin:2px 0}.pol{max-height:230px;overflow:auto;font-size:12px;line-height:1.7;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--card)}
.pol.big{max-height:none;border:0;padding:0;background:none}.pol h4{margin:12px 0 2px;font-size:13px}.pol a{color:var(--coral)}
.in p.note{font-size:12px}
.info{text-align:center;font-size:12px;color:var(--mute);padding:22px 4px 40px;line-height:1.9}.info a{color:var(--coral);font-weight:700}
.lnk{background:none;border:0;font:inherit;color:var(--coral);font-weight:700;text-decoration:underline;cursor:pointer;padding:0;margin-top:6px}
.f .chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:700;color:var(--ink);margin:10px 0 0}.f .chk input{width:auto;padding:0;margin:3px 0 0;flex:none}
</style></head><body>

<script>
// ▼ 求人データ。photo(img)に画像URLかdata:URIを入れるだけで写真を追加できます(空なら絵文字のプレースホルダー)
let JOBS=[];
const EM={'カフェ':'☕','イタリアン':'🍝','ビストロ・居酒屋':'🍷','ラーメン':'🍜'};
const $=s=>document.querySelector(s),yen=n=>n.toLocaleString(),wage=j=>!j.wmin&&!j.wmax?'応相談':j.open?yen(j.wmin)+'円〜':j.wmin===j.wmax?yen(j.wmin)+'円':yen(j.wmin)+'円〜'+yen(j.wmax)+'円';
const uniq=k=>[...new Set(JOBS.map(j=>j[k]))];
const PERK_LIST=['交通費支給','まかないあり','制服貸与','社員割引','昇給あり','シフト相談OK','ネイルOK'];
$('#fw').innerHTML=[...$('#fw').options].map(o=>o.value==='0'?o.outerHTML:`<option value="${o.value}">${yen(+o.value)}円以上</option>`).join('');
function buildFilters(){const P=[...new Set([...PERK_LIST,...JOBS.flatMap(j=>j.perks)])];
 $('#fa').innerHTML='<option value="">すべて</option>'+uniq('area').map(a=>`<option>${a}</option>`).join('');
 $('#fc').innerHTML='<option value="">すべて</option>'+uniq('cat').map(a=>`<option>${a}</option>`).join('');
 $('#fp').innerHTML=P.map(p=>`<label><input type="checkbox" value="${p}"><span>${p}</span></label>`).join('')}
const colv=c=>`var(--${c})`;
function render(){
 const q=$('#q').value.trim().toLowerCase(),a=$('#fa').value,c=$('#fc').value,w=+$('#fw').value,ps=[...document.querySelectorAll('#fp input:checked')].map(i=>i.value);
 const r=JOBS.filter(j=>(!q||(j.name+j.kana).toLowerCase().includes(q))&&(!a||j.area===a)&&(!c||j.cat===c)&&j.wmax>=w&&ps.every(p=>j.perks.includes(p)));
 $('#cnt').textContent=r.length+'件の求人';
 $('#list').innerHTML=r.length?r.map(j=>`<article class="card rv on"><div class="im">${j.img?`<img src="${j.img}" alt="${j.name}" loading="lazy" decoding="async" onerror="this.remove()">`:EM[j.cat]||'🍽️'}<span class="tag" style="background:${colv(j.col)}">${j.cat}</span>${j.tag?`<span class="cm">${j.tag}</span>`:''}</div><div class="bd"><h3>${j.name} <small>(${j.kana})</small></h3><div class="k">${j.sub}</div>
 <div class="r"><i style="background:var(--coral)">¥</i><em>時給</em><span class="w2">${wage(j)}</span></div>
 <div class="r"><i style="background:#F5A94B">⌖</i><em>勤務地</em><span>${j.addr}</span></div>
 <div class="r"><i style="background:#F5A94B">★</i><em>福利厚生</em><span>${j.perks.join(' / ')}</span></div>
 <button class="btn ${j.col}" data-id="${j.id}">詳細を見る →</button></div></article>`).join(''):(JOBS.length?'<div class="none">😢 条件に合う求人が見つかりませんでした。<br>条件を変えてお試しください。</div>':'<div class="none">現在、掲載中の求人はありません。</div>');
}
['#q','#fa','#fc','#fw','#fp'].forEach(s=>$(s).addEventListener('input',render));
$('#rst').onclick=()=>{$('#q').value='';$('#fa').value='';$('#fc').value='';$('#fw').value='0';document.querySelectorAll('#fp input').forEach(i=>i.checked=false);render()};
// ▼ 運営者情報と個人情報の取扱い。【 】が残っている項目は、決まり次第ここを書き換えてください

const policyHTML=()=>{const P=POLICY,p=t=>`<p>${t}</p>`,h=t=>`<h4>${t}</h4>`;return [
 p('株式会社FOUP（以下「当社」といいます。）は、当社が運営する飲食店向けの求人サイトおよび採用情報を発信するSNSアカウント（以下あわせて「本サービス」といいます。）を通じてご応募いただいた方（以下「応募者」といいます。）の個人情報を、以下のとおり取り扱います。'),
 p('本サービスにおいて、当社は、求人を行う飲食店等（以下「求人店舗」といいます。）の求人情報を掲載し、応募フォームから送信された応募内容を受け付けて、応募先の求人店舗へお送りします。面接の日程調整、選考および採用の判断は、求人店舗が行います。当社は、応募者の採用を保証するものではありません。'),
 h('第1条（事業者）'),p('本ポリシーに基づき個人情報を取り扱う事業者は、次のとおりです。'),p(`名称：${P.company}`),p(`所在地：${P.address}`),p(`代表者：${P.rep}`),
 h('第2条（取得する情報）'),p('当社は、応募フォームを通じて、次の情報を取得します。'),p('(1) 氏名'),p('(2) 生年月日'),p('(3) メールアドレス'),p('(4) 電話番号'),p('(5) 応募先の求人店舗名'),

 p('(1) 応募フォームに入力いただいた情報を、応募先の求人店舗に提供し、求人店舗から応募者へ連絡してもらうため'),p('(2) 応募の受付状況に関するお問い合わせに対応するため'),p('(3) 応募者が受付対象の年齢（第8条）を満たしているかを確認するため'),
 p('2 当社は、取得した個人情報を、応募先以外の求人のご案内、広告の配信その他前項以外の目的には利用しません。'),

 h('第5条（外部サービスの利用と外国での取扱い）'),
 p('1 当社は、応募フォームの送信内容を受け付け、当社に電子メールで届けるため、Formspree, Inc.が提供するフォーム送信サービス「Formspree」を利用しています。応募フォームに入力された情報は、同社のサーバーを経由し、同サーバーにも保存されます。'),

 p('3 アメリカ合衆国には、個人情報の保護に関する包括的な連邦法令は存在せず、個別の分野に適用される法令があります。詳しくは、個人情報保護委員会が公表している<a href="https://www.ppc.go.jp/enforcement/infoprovision/laws/offshore_report_america/" target="_blank" rel="noopener noreferrer">「外国制度（アメリカ合衆国）」</a>のページをご確認ください。'),
 p('4 Formspree, Inc.が個人情報の保護のために講じている措置は、同社の<a href="https://formspree.io/legal/privacy-policy/" target="_blank" rel="noopener noreferrer">プライバシーポリシー</a>に記載されています。'),
 p('5 当社は、応募者の同意を得たうえで、前各項のとおり個人情報を取り扱います。'),
 h('第6条（保存期間と削除）'),p(`当社は、応募者の個人情報を、応募を受け付けた日から${P.retention}を経過した後、速やかに削除します。削除の対象には、当社が受信した電子メール、求人店舗へ送信した電子メールおよびFormspree上に保存された情報を含みます。`),
 h('第7条（安全管理）'),p(`当社は、個人情報の漏えい、滅失または毀損を防ぐため、個人情報を取り扱う者を${P.staff}に限り、それ以外の者が受信用のメールアカウントおよびFormspreeの管理画面にアクセスできないようにします。また、個人情報を取り扱う者には、業務上知った応募者の情報を正当な理由なく他人に漏らさないよう周知します。`),
 h('第8条（受付対象の年齢と未成年者の方）'),p('1 本サービスで応募できるのは、高校生以上の方です。中学生以下の方は応募できません。'),p('2 18歳未満の方は、保護者の方の同意を得たうえで応募してください。'),
 h('第9条（開示等の請求）'),p('応募者は、当社が保有するご自身の個人情報について、開示、訂正、利用の停止、削除等を求めることができます。ご希望の方は、第10条の窓口までご連絡ください。ご本人であることを確認したうえで、法令に従い対応します。'),
 h('第10条（お問い合わせ・苦情の窓口）'),p('本ポリシーおよび本サービスに関するお問い合わせ・苦情は、次の窓口で受け付けます。'),p(`窓口：${P.dept}`),p(`メールアドレス：${P.email}`),p(`電話番号：${P.tel}（受付時間：${P.hours}）`),
 h('第11条（改定）'),p('当社は、必要に応じて本ポリシーを改定することがあります。改定後のポリシーは、本サービスのサイトに掲載した時点から効力を生じます。ただし、利用目的や提供先を変えるなど、法令上応募者の同意が必要なときは、あらためて同意をいただきます。'),
 p(`制定日：${P.date}`)].join('')};
const buildInfo=()=>{const P=POLICY;$('#info').innerHTML=`<div>運営：${P.company}（${P.rep}）</div><div>所在地：${P.address}</div><div>お問い合わせ：<a href="mailto:${P.email}">${P.email}</a>／<a href="tel:${P.tel.replace(/-/g,'')}">${P.tel}</a>（受付時間：${P.hours}）</div><div><button class="lnk" id="pvbtn">個人情報の取扱いについて</button></div>`;$('#pvbtn').onclick=()=>open_(`<div class="in"><h3>個人情報の取扱いについて</h3><div class="pol big">${policyHTML()}</div></div>`)};
// ▼ 応募の送信先。Formspree等のURLを入れるとメール自動送信、空ならメールアプリを起動
const ENDPOINT='https://formspree.io/f/xwlvdwbn';
const open_=h=>{$('#sh').innerHTML='<button class="x" aria-label="閉じる">×</button>'+h;$('#ov').classList.add('open');$('#sh').scrollTop=0;$('#sh .x').onclick=close_};
const close_=()=>$('#ov').classList.remove('open');
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')close_()});
$('#list').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)detail(JOBS.find(j=>j.id===b.dataset.id))});
function detail(j){
 open_(`<div class="im" style="aspect-ratio:1.6">${j.img?`<img src="${j.img}" alt="">`:EM[j.cat]||'🍽️'}</div><div class="in"><h3>${j.name}</h3><div class="k" style="color:var(--mute);font-size:13px">${j.sub}</div>
 <div class="r"><i style="background:var(--coral)">¥</i><em>時給</em><span class="w2">${wage(j)}</span></div>
 <div class="r"><i style="background:#F5A94B">⌖</i><em>勤務地</em><span>${j.addr}</span></div>
 <div class="r"><i style="background:#F5A94B">♪</i><em>仕事内容</em><span>${j.role}<br>${j.desc}</span></div>
 <div class="r"><i style="background:#F5A94B">★</i><em>福利厚生</em><span>${j.perks.join(' / ')}</span></div>
 <button class="btn coral" id="ap">この求人に応募する</button></div>`);
 $('#ap').onclick=()=>form(j);
}
function form(j){
 const today=new Date().toISOString().slice(0,10),P=POLICY,lock=MISSING&&!location.search.includes('debug');
 open_(`<div class="in f"><h3>${j.name} に応募</h3><p class="note">応募内容は${P.company}が受け付け、応募先のお店へお送りします。面接の日程調整や選考・採用の判断は、お店が行います。</p>
 <form id="fm"><label>お名前</label><input name="name" required maxlength="50" autocomplete="name" placeholder="例:山田 花子">
 <label>生年月日</label><input name="birth" type="date" required min="1930-01-01" max="${today}">
 <label>メールアドレス</label><input name="email" type="email" required maxlength="100" autocomplete="email" placeholder="example@mail.com">
 <label>電話番号</label><input name="tel" type="tel" required maxlength="13" pattern="[0-9\\-]{10,13}" inputmode="tel" placeholder="090-1234-5678">
 <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
 <div class="pv"><b>個人情報の取扱いについて</b><ul>
 <li><b>取得する情報：</b>氏名・生年月日・メールアドレス・電話番号・応募先のお店の名前</li>
 <li><b>利用目的：</b>応募内容を応募先のお店に提供し、お店から連絡してもらうため／受付状況のお問い合わせに対応するため／応募できる年齢か確認するため</li>
 <li><b>提供先：</b>応募先のお店（メールでお送りします）</li>
 <li><b>外国での取扱い：</b>入力内容は、アメリカ合衆国の Formspree, Inc. のサーバーを経由し、保存されます</li>
 <li><b>保存期間：</b>応募を受け付けた日から${P.retention}を経過した後、削除します</li></ul>
 <details><summary>取扱いの全文を読む</summary><div class="pol">${policyHTML()}</div></details></div>
 <label class="chk"><input type="checkbox" name="agree1" required><span>個人情報の取扱い（利用目的と、応募先のお店への提供）に同意します</span></label>
 <label class="chk"><input type="checkbox" name="agree2" required><span>入力内容が、アメリカ合衆国の Formspree, Inc. のサーバーを経由し、保存されることに同意します</span></label>
 <label class="chk"><input type="checkbox" name="agree3" required><span>高校生以上です。18歳未満の場合は、保護者の同意を得ています</span></label>
 <p class="note" id="er" style="color:#d33;display:none"></p>
 ${lock?'<p class="note" style="color:#d33">現在、個人情報の取扱いの記載を準備中のため、応募を受け付けていません。</p>':''}
 <button class="btn coral" type="submit"${lock?' disabled':''}>応募を送信する</button></form></div>`);
 const er=m=>{const e=$('#er');e.textContent=m;e.style.display='block'};
 $('#fm').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button[type=submit]'),d=Object.fromEntries(new FormData(f));
  const bd=new Date(d.birth),n=new Date();let age=n.getFullYear()-bd.getFullYear();if(n<new Date(n.getFullYear(),bd.getMonth(),bd.getDate()))age--;
  if(!(age>=15)){er('中学生以下の方は応募できません。生年月日をご確認ください。');return}
  if(!d._gotcha){b.disabled=true;
   try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({name:d.name,birth:d.birth,email:d.email,tel:d.tel,shop:j.name,consent:'個人情報の取扱い・外国での取扱い・年齢と保護者の同意に同意済み',_replyto:d.email,_subject:'【応募】'+j.name})});if(!r.ok)throw 0}
   catch(_){b.disabled=false;er('送信に失敗しました。時間をおいて、もう一度お試しください。');return}}
  open_(`<div class="done"><div class="e">🎉</div><h3>応募が完了しました!</h3><p>${j.name} への応募を受け付けました。<br><b>お店からメールまたはお電話で連絡がきます。</b><br>しばらくお待ちください。</p><button class="btn green" id="cl">閉じる</button></div>`);$('#cl').onclick=close_};
}
const io='IntersectionObserver'in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}}),{threshold:.15}):null;
document.querySelectorAll('.rv').forEach(el=>io?io.observe(el):el.classList.add('on'));
// ▼ Googleスプレッドシート(「ウェブに公開」したCSVのURL)。空のままなら上の店舗データを使います
const SHEET_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQApJ0wPfrM0sB3gAeQ1Nf53FOZ4Jx4JE_LKOW_7t0ZK7xwpbuYmSwwRw94qtNhxe7uk3AjU4gJMQaa/pub?gid=2097025008&single=true&output=csv';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseCSV(t){const r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'){row.push(c);r.push(row);row=[];c=''}else if(ch!='\r')c+=ch}if(c||row.length){row.push(c);r.push(row)}return r}
const imgSrc=s=>{s=String(s||'').trim();if(!s)return'';
 const m=s.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{20,})/);
 if(m)return'https://lh3.googleusercontent.com/d/'+m[1]+'=w800';
 if(/^https:\/\/[\w.-]*googleusercontent\.com\//.test(s))return esc(s);
 if(/^[\w.-]+$/.test(s))return esc(s);return''};
const nums=s=>(String(s||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[,，]/g,'').match(/\d+/g)||[]).map(Number);
const HIDE_NAMES=['Sunny Cafe','Trattoria Bella','Bistro 365'];
async function loadSheet(){if(!SHEET_URL)return;
 try{const r=await fetch(SHEET_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
  const rows=parseCSV(await r.text()).filter(a=>a.some(c=>c.trim()));const h=rows.shift().map(s=>s.trim());
  const list=rows.map(a=>{const o={};h.forEach((k,x)=>o[k]=(a[x]||'').trim());return o}).filter(o=>o.name&&!HIDE_NAMES.includes(o.name)&&!/^(いいえ|no|false|0|非公開)$/i.test(o.show||''));
  if(!list.length)throw new Error('表示できる行がありません(シートの店舗:'+rows.length+'行)');
  JOBS=list.map((o,i)=>{const a=nums(o.wmin),b=nums(o.wmax),wmin=a[0]||b[0]||0,wmax=b[0]||a[1]||wmin,open=!b.length&&a.length<2&&wmin>0;return{open,id:esc(o.id||'s'+i),name:esc(o.name),kana:esc(o.kana),cat:esc(o.cat),sub:esc(o.sub||o.cat),role:esc(o.role),col:['coral','green','blue'].includes(o.col)?o.col:'coral',wmin,wmax,area:esc(o.area),addr:esc(o.addr),perks:(o.perks||'').split(/[\/／,、]\s*/).map(s=>esc(s.trim())).filter(Boolean),tag:esc(o.tag),img:imgSrc(o.img),desc:esc(o.desc)}});
  buildFilters();render();dbg(' (シート接続OK:シートの店舗'+rows.length+'行→表示'+list.length+'件)'+(MISSING?' ※ポリシーに【】が残っています':''))}catch(e){dbg(' (シート接続失敗:'+(e&&e.name==='TypeError'?'通信がブロックされたか、URLが違います':e.message)+')')}}
function dbg(m){if(location.search.includes('debug'))$('#cnt').textContent+=m}
buildFilters();render();buildInfo();loadSheet();
</script></body></html>
